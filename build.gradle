plugins {
    id 'java-library'
    id 'distribution'
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets {
    integrationTest {
        java.srcDir file('src/integration-test/java')
        resources.srcDir file('src/integration-test/resources')
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

ext {
    chicoryVersion = "1.4.0"
    jacksonVersion = "2.18.2"
    junit5Version = "5.11.4"
    log4jVersion = "2.24.3"
    testcontainersVersion = "1.20.4"
    kafkaVersion = "3.8.1"
}

dependencies {
    // Provided by the Connect worker at runtime.
    compileOnly "org.apache.kafka:connect-api:$kafkaVersion"
    compileOnly "org.apache.kafka:connect-json:$kafkaVersion"
    compileOnly "org.slf4j:slf4j-api:1.7.36"

    // Pure-Java WebAssembly runtime: no JNI, no native artifacts, so the
    // plugin stays a plain JAR on every Connect worker.
    implementation "com.dylibso.chicory:runtime:$chicoryVersion"
    implementation "com.dylibso.chicory:wasm:$chicoryVersion"
    // Compiles wasm to JVM bytecode at task start-up. Still pure Java: no native artifacts.
    implementation "com.dylibso.chicory:compiler:$chicoryVersion"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"

    testImplementation "org.apache.kafka:connect-api:$kafkaVersion"
    testImplementation "org.apache.kafka:connect-json:$kafkaVersion"
    testImplementation "org.slf4j:slf4j-api:1.7.36"
    testImplementation "org.junit.jupiter:junit-jupiter:$junit5Version"
    testImplementation "org.assertj:assertj-core:3.27.3"
    // Compiles WebAssembly text format inline, so tests need no external wasm toolchain.
    testImplementation "com.dylibso.chicory:wabt:$chicoryVersion"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation "org.apache.kafka:connect-api:$kafkaVersion"
    integrationTestImplementation("org.apache.kafka:connect-runtime:$kafkaVersion") {
        exclude group: "org.slf4j", module: "slf4j-log4j12"
    }
    integrationTestImplementation "org.apache.kafka:connect-json:$kafkaVersion"
    integrationTestImplementation "org.testcontainers:junit-jupiter:$testcontainersVersion"
    integrationTestImplementation "org.testcontainers:kafka:$testcontainersVersion"
    integrationTestRuntimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:$log4jVersion"
    integrationTestRuntimeOnly "org.apache.logging.log4j:log4j-core:$log4jVersion"
    // connect-runtime's REST layer still references log4j 1.x; bridge it so the worker starts.
    integrationTestRuntimeOnly "org.apache.logging.log4j:log4j-1.2-api:$log4jVersion"
}

checkstyle {
    toolVersion '10.20.1'
    configFile = file('config/checkstyle/checkstyle.xml')
}

test {
    useJUnitPlatform()
    // Lets DockerSandboxIT reach a Docker Sandboxes engine mounted from the host.
    if (project.hasProperty('dockerSocket')) {
        systemProperty 'sandbox.docker.socket', project.property('dockerSocket')
    }
    testLogging { events 'passed', 'skipped', 'failed' }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs the transform inside a real Connect worker against a real Kafka broker.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    // The worker loads the transform from plugin.path, exactly as an operator would.
    dependsOn tasks.named('installDist')
    systemProperty 'integration-test.plugin.dir',
        layout.buildDirectory.dir("install/${project.name}").get().asFile.absolutePath
    systemProperty 'integration-test.wasm.module',
        file('examples/redact-rs/target/wasm32-unknown-unknown/release/redact.wasm').absolutePath

    // Fail rather than skip when the guest has not been built. The integration tests used to
    // guard themselves with assumeThat(module.exists()), which meant that forgetting the cargo
    // build -- or breaking it -- produced a green run that had asserted nothing at all. The
    // whole point of this suite is that it is the only evidence the plugin installs and works,
    // so its absence has to be louder than its success.
    doFirst {
        final wasm = file(
            'examples/redact-rs/target/wasm32-unknown-unknown/release/redact.wasm')
        if (!wasm.exists() && !project.hasProperty('allowMissingGuest')) {
            throw new GradleException(
                "The Rust guest has not been built, so the integration tests would prove "
                    + "nothing.\n  Expected: ${wasm}\n"
                    + "  Build it: cd examples/redact-rs && cargo build --release "
                    + "--target wasm32-unknown-unknown\n"
                    + "  Or skip deliberately: ./gradlew integrationTest -PallowMissingGuest")
        }
    }
    // A skip is only ever legitimate when someone asked for one. The tests read this to decide
    // between aborting (explicitly requested) and failing (the guest is simply not there).
    systemProperty 'integration-test.allow-missing-guest',
        project.hasProperty('allowMissingGuest').toString()

    // Lets the test run against a broker started outside the build.
    if (project.hasProperty('bootstrapServers')) {
        systemProperty 'integration-test.bootstrap.servers', project.property('bootstrapServers')
    }
    testLogging { events 'passed', 'skipped', 'failed' ; showStandardStreams = false }
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Measures the per-record cost of each sandbox boundary.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.islo.kafka.connect.sandbox.BoundaryCostBenchmark'
}

distributions {
    main {
        contents {
            from jar
            from configurations.runtimeClasspath
        }
    }
}
